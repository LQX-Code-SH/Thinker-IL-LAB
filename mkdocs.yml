site_name: Thinker-IL-LAB
site_description: Thinker 机器人模仿学习工具链 - 基于 Isaac Sim 与 LeRobot 的完整模仿学习解决方案
site_author: Thinker Robotics
site_url: https://lqx-code-sh.github.io/Thinker-IL-LAB/
repo_url: https://github.com/LQX-Code-SH/Thinker-IL-LAB
repo_name: LQX-Code-SH/Thinker-IL-LAB

docs_dir: docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至亮色模式
  icon:
    repo: fontawesome/brands/github

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 仿真平台:
      - 平台概览: sim/index.md
      - 容器构建与使用: sim/docker.md
      - 天工行者: tienkung/sim-setup.md
      - Walker S2 EDU 探索者: walker-s2/sim-setup.md
  - 模仿学习平台:
      - 平台概览: il/index.md
      - 容器构建与使用: il/docker.md
      - 天工行者: tienkung/convert-train.md
      - Walker S2 EDU 探索者: walker-s2/convert-train.md
  - 天工行者:
      - 机型概览: tienkung/index.md
      - 仿真全流程: tienkung/sim-workflow.md
      - 真机全流程: tienkung/real-workflow.md
      - 参考文档:
          - ARM 板端部署: tienkung/arm-deploy.md
  - Walker S2 EDU 探索者:
      - 机型概览: walker-s2/index.md
      - 仿真全流程: walker-s2/sim-workflow.md
      - 真机全流程: walker-s2/real-workflow.md
      - 应用案例: walker-s2/application-case.md
      - 参考文档:
          - 真机部署: walker-s2/deploy.md
          - 推理服务器: walker-s2/inference-server.md
          - 腕部相机: walker-s2/wrist-camera.md
          - SDK 二次开发文档: walker-s2/cc-api.md
  - 通用参考:
    - 容器环境: common/docker.md
    - 数据转换详解: common/data-conversion.md
    - HDF5 数据布局: common/hdf5-layouts.md
    - 数据可视化与回放: common/playback.md
    - HF 数据/模型管理: common/hf-manage.md
  - 架构总览: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: 本页内容
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - zh
        - en
