[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_tienkung_dex"
version = "0.1.0"
description = "TienKung Dex (right arm + dexterous hand) robot plugin for LeRobot"
requires-python = ">=3.12"
dependencies = ["pyzmq"]

[tool.setuptools.packages.find]
include = ["lerobot_robot_tienkung_dex*"]
